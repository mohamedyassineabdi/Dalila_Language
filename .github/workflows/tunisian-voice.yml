name: Tunisian neural voice audio evaluation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'dalila/tunisian_worker.py'
      - 'requirements-tunisian-voice.txt'
      - 'tunisian_voice_eval.py'
      - '.github/workflows/tunisian-voice.yml'
permissions:
  contents: read
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DALILA_TUNISIAN_RESEARCH: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-tunisian-voice.txt
      - run: python tunisian_voice_eval.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tunisian-voice-evaluation
          path: outputs/tunisian_voice_eval/
          if-no-files-found: warn
